<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Jamesel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236d4aff'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>J</text></svg>">
<style>
  :root {
    --bg: #fbf8f3; --fg: #1f1b2e; --muted: #7a7590; --tile: #ffffff; --line: #d9d3e6;
    --accent: #6d4aff; --accent-fg: #ffffff; --goal: #f2b705; --key: #e7e2f0; --bad: #e0464e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15131d; --fg: #f1eef8; --muted: #9a94b3; --tile: #201d2b; --line: #3a3550;
      --key: #2d2940; --goal: #f2b705; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; -webkit-tap-highlight-color: transparent; }
  header { width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 28px; letter-spacing: 4px; font-weight: 900; }
  h1 span { color: var(--accent); }
  .icon-btn { background: none; border: 2px solid var(--line); color: var(--fg); border-radius: 50%;
    width: 36px; height: 36px; font-weight: 800; font-size: 16px; cursor: pointer; }
  .sub { color: var(--muted); font-size: 14px; margin: 10px 0 4px; text-align: center; }
  .sub b { color: var(--fg); }
  #board { flex: 1; overflow-y: auto; width: 100%; max-width: 500px; padding: 8px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; position: relative; }
  .row .n { position: absolute; left: -30px; width: 24px; text-align: right; color: var(--muted); font-size: 12px; }
  .tile { width: 52px; height: 52px; border: 2px solid var(--line); background: var(--tile); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; text-transform: uppercase; }
  .tile.changed { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .tile.filled { border-color: var(--muted); }
  .row.start .tile { border-color: var(--fg); }
  .row.goal .tile { border: 2px dashed var(--goal); color: var(--goal); background: transparent; }
  .row.won .tile { background: var(--goal); border-color: var(--goal); color: #1f1b2e; }
  .arrow { color: var(--muted); font-size: 12px; line-height: 1; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }
  #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 8px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }
  .controls { display: flex; gap: 8px; margin: 6px 0; }
  .btn { border: none; background: var(--key); color: var(--fg); padding: 8px 14px; border-radius: 8px;
    font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  #kb { width: 100%; max-width: 500px; padding: 0 6px 12px; }
  .kr { display: flex; gap: 5px; justify-content: center; margin-bottom: 6px; }
  .key { flex: 1; max-width: 44px; height: 54px; border: none; border-radius: 6px; background: var(--key); color: var(--fg);
    font-weight: 700; font-size: 15px; text-transform: uppercase; cursor: pointer; padding: 0; }
  .key.wide { max-width: 68px; flex: 1.5; font-size: 12px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal.open { display: flex; }
  .card { background: var(--bg); border-radius: 14px; padding: 20px; max-width: 400px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; }
  .card h2 { margin-top: 0; }
  .card .x { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 22px; color: var(--fg); cursor: pointer; }
  .mini { display: flex; gap: 4px; margin: 6px 0; }
  .mini .tile { width: 36px; height: 36px; font-size: 18px; }
  .stat { font-size: 40px; font-weight: 900; text-align: center; margin: 8px 0 0; }
  .center { text-align: center; }
  .path { color: var(--muted); font-size: 14px; letter-spacing: 1px; text-transform: uppercase; word-break: break-word; }
  .face { position: fixed; left: 0; top: 0; border-radius: 50%; z-index: 15; cursor: grab; user-select: none;
    background-image: url(face.webp); background-repeat: no-repeat; box-shadow: 0 4px 14px rgba(0,0,0,.35);
    border: 3px solid var(--goal); will-change: transform; touch-action: none; }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="helpBtn" aria-label="How to play">?</button>
  <h1>JAMES<span>EL</span></h1>
  <button class="icon-btn" id="newBtn" aria-label="Practice with a random word" title="Practice: random start">&#8635;</button>
</header>
<div class="sub" id="sub"></div>
<div id="board"></div>
<div class="controls">
  <button class="btn" id="undoBtn">Undo</button>
  <button class="btn" id="hintBtn">Hint</button>
</div>
<div id="kb"></div>
<div id="toast"></div>

<div class="modal" id="help">
  <div class="card">
    <button class="x" data-close>&times;</button>
    <h2>How to play</h2>
    <p>Get to <b>JAMES</b> in as few steps as possible.</p>
    <p>Each word must be exactly one letter different from the last:</p>
    <div class="mini"><div class="tile">l</div><div class="tile">a</div><div class="tile">m</div><div class="tile">p</div><div class="tile">s</div></div>
    <div class="mini"><div class="tile">l</div><div class="tile">a</div><div class="tile">m</div><div class="tile changed">e</div><div class="tile">s</div></div>
    <p>A random starting word is chosen daily. Can you find the shortest path?</p>
    <p class="path">Tap &#8635; for a random practice word.</p>
  </div>
</div>

<div class="modal" id="win">
  <div class="card center">
    <button class="x" data-close>&times;</button>
    <h2 id="winTitle">You reached JAMES!</h2>
    <div class="stat" id="winSteps"></div>
    <p id="winPar"></p>
    <p class="path" id="winPath"></p>
    <p class="path" id="bestPath"></p>
    <button class="btn primary" id="shareBtn">Share</button>
  </div>
</div>

<script src="words.js"></script>
<script>
const GOAL = "james";
const DICT = new Set(WORDS);
const ABC = "abcdefghijklmnopqrstuvwxyz";

function neighbors(w) {
  const out = [];
  for (let i = 0; i < 5; i++) for (const c of ABC) {
    if (c === w[i]) continue;
    const x = w.slice(0, i) + c + w.slice(i + 1);
    if (DICT.has(x)) out.push(x);
  }
  return out;
}

// Distance of every word from JAMES, so we know the best possible score.
const DIST = new Map([[GOAL, 0]]);
{ const q = [GOAL];
  for (let h = 0; h < q.length; h++) for (const v of neighbors(q[h]))
    if (!DIST.has(v)) { DIST.set(v, DIST.get(q[h]) + 1); q.push(v); } }

const NO_START = new Set("boner horny boobs booby pubic fecal enema bimbo pygmy gypsy".split(" "));
const POOL = [...DIST.keys()].filter(w => DIST.get(w) >= 4 && DIST.get(w) <= 7 && !NO_START.has(w)).sort();

// Day 1 = launch day; everyone gets the same start word on the same date.
const EPOCH = new Date(2026, 10, 7);
const today = new Date(); today.setHours(0, 0, 0, 0);
const DAY = Math.round((today - EPOCH) / 864e5) + 1;
function seeded(n) { let x = (n * 2654435761) >>> 0; x ^= x >>> 15; x = Math.imul(x, 2246822519) >>> 0; x ^= x >>> 13; return x >>> 0; }
const DAILY = POOL[seeded(DAY + 1000) % POOL.length];

function shortestPath(from) {
  const p = [from];
  while (p[p.length - 1] !== GOAL) {
    const cur = p[p.length - 1];
    p.push(neighbors(cur).find(v => DIST.get(v) === DIST.get(cur) - 1));
  }
  return p;
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let practice = false, start, path, typed = "", hints = 0;

function load(isPractice, word) {
  practice = isPractice;
  start = word; typed = "";
  const saved = !practice && store.get("jamesel-" + DAY);
  path = saved && saved.start === start ? saved.path : [start];
  hints = saved && saved.start === start ? saved.hints || 0 : 0;
  render();
  if (done()) setTimeout(showWin, 300);
}
function save() { if (!practice) store.set("jamesel-" + DAY, { start, path, hints }); }
const done = () => path[path.length - 1] === GOAL;
const steps = () => path.length - 1;

const $ = id => document.getElementById(id);
function tiles(word, prev, cls = "") {
  const r = document.createElement("div"); r.className = "row " + cls;
  for (let i = 0; i < 5; i++) {
    const t = document.createElement("div");
    t.className = "tile" + (prev && word[i] && word[i] !== prev[i] ? " changed" : "") + (word[i] ? " filled" : "");
    t.textContent = word[i] || "";
    r.appendChild(t);
  }
  return r;
}

function render() {
  $("sub").innerHTML = (practice ? "Practice" : "Jamesel #" + DAY) +
    " &middot; Steps: <b>" + steps() + "</b>" + (done() ? " &middot; Best: <b>" + DIST.get(start) + "</b>" : "");
  const b = $("board"); b.innerHTML = "";
  path.forEach((w, i) => {
    const r = tiles(w, path[i - 1], (i === 0 ? "start " : "") + (w === GOAL ? "won" : ""));
    if (i > 0) { const n = document.createElement("span"); n.className = "n"; n.textContent = i; r.appendChild(n); }
    b.appendChild(r);
  });
  if (!done()) {
    b.appendChild(tiles(typed, null, "cur"));
    const a = document.createElement("div"); a.className = "arrow"; a.textContent = "⋮"; b.appendChild(a);
    b.appendChild(tiles(GOAL, null, "goal"));
  }
  b.scrollTop = b.scrollHeight;
}

let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600);
}
function shake() {
  const r = document.querySelector(".row.cur"); if (!r) return;
  r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake");
}

function submit() {
  if (done()) return;
  const prev = path[path.length - 1];
  if (typed.length < 5) { toast("Not enough letters"); return shake(); }
  if (!DICT.has(typed)) { toast("Not in word list"); return shake(); }
  let diff = 0; for (let i = 0; i < 5; i++) if (typed[i] !== prev[i]) diff++;
  if (diff !== 1) { toast("Change exactly one letter"); return shake(); }
  if (path.includes(typed)) { toast("Already used"); return shake(); }
  path.push(typed); typed = ""; save(); render();
  if (done()) setTimeout(showWin, 400);
}

function press(k) {
  if (done()) return;
  if (k === "enter") submit();
  else if (k === "back") { typed = typed.slice(0, -1); render(); }
  else if (/^[a-z]$/.test(k) && typed.length < 5) { typed += k; render(); }
}

function undo() {
  if (done() && !practice) return toast("Already solved today!");
  if (typed) { typed = ""; render(); return; }
  if (path.length > 1) { path.pop(); save(); render(); }
}

function hint() {
  if (done()) return;
  const cur = path[path.length - 1];
  if (!DIST.has(cur)) return toast("Dead end from here. Try Undo");
  const next = neighbors(cur).find(v => DIST.get(v) === DIST.get(cur) - 1);
  const i = [...next].findIndex((c, j) => c !== cur[j]);
  hints++; save();
  toast("Try changing letter " + (i + 1) + " (" + DIST.get(cur) + " steps left at best)");
}

function shareText() {
  const best = DIST.get(start), s = steps();
  const grid = path.slice(1).map((w, i) => {
    const p = path[i]; return [...w].map((c, j) => c !== p[j] ? (w === GOAL ? "🟨" : "🟪") : "⬜").join("");
  }).join("\n");
  return (practice ? "Jamesel (practice)" : "Jamesel #" + DAY) + "\n" + start.toUpperCase() + " → JAMES in " + s +
    (s === best ? " (perfect!)" : " (best " + best + ")") + (hints ? " · " + hints + " hint" + (hints > 1 ? "s" : "") : "") + "\n" + grid;
}

function showWin() {
  const best = DIST.get(start), s = steps();
  $("winTitle").textContent = s === best ? "Perfect path!" : "You reached JAMES!";
  $("winSteps").textContent = s + (s === 1 ? " step" : " steps");
  $("winPar").textContent = s === best ? "That's the shortest possible." : "Shortest possible was " + best + ".";
  $("winPath").textContent = path.join(" → ");
  $("bestPath").textContent = s === best ? "" : "One best path: " + shortestPath(start).join(" → ");
  $("win").classList.add("open");
  for (let i = 0; i < 6; i++) setTimeout(() => spawnFace(innerWidth / 2, innerHeight / 2, true), i * 120);
}

// The bouncing face. Crop box of the head in face.webp (1206x570), in source pixels.
const CROP = { x: 475, y: 50, size: 400, imgW: 1206, imgH: 570 };
const faces = [];
let mouse = { x: -1e4, y: -1e4 };
function spawnFace(x, y, burst) {
  const size = Math.max(64, Math.min(110, innerWidth / 6)) * (burst ? 0.75 : 1);
  const el = document.createElement("div"); el.className = "face";
  const k = size / CROP.size;
  Object.assign(el.style, { width: size + "px", height: size + "px",
    backgroundSize: CROP.imgW * k + "px " + CROP.imgH * k + "px",
    backgroundPosition: -CROP.x * k + "px " + -CROP.y * k + "px" });
  const a = Math.random() * Math.PI * 2, sp = burst ? 9 : 3;
  const f = { el, size, x: x - size / 2, y: y - size / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: 0, vr: 0, squash: 0 };
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    const b = Math.random() * Math.PI * 2;
    f.vx = Math.cos(b) * 14; f.vy = Math.sin(b) * 14; f.vr = (Math.random() < .5 ? -1 : 1) * 25;
    if (faces.length < 25) spawnFace(f.x + size / 2, f.y + size / 2, true);
  });
  document.body.appendChild(el); faces.push(f);
}
addEventListener("pointermove", e => { mouse = { x: e.clientX, y: e.clientY }; });
document.addEventListener("pointerleave", () => { mouse = { x: -1e4, y: -1e4 }; });

function tick() {
  const W = innerWidth, H = innerHeight;
  for (const f of faces) {
    // run away from the cursor
    const cx = f.x + f.size / 2, cy = f.y + f.size / 2;
    const dx = cx - mouse.x, dy = cy - mouse.y, d = Math.hypot(dx, dy), R = f.size * 1.6;
    if (d < R && d > 0) { const push = (1 - d / R) * 1.8; f.vx += dx / d * push; f.vy += dy / d * push; f.vr += dx > 0 ? 1 : -1; }
    // keep a cruising speed, cap the top speed
    const sp = Math.hypot(f.vx, f.vy), target = 3;
    const k = sp > 16 ? 16 / sp : sp > target ? 0.985 : sp < target ? 1.02 : 1;
    f.vx *= k; f.vy *= k;
    f.x += f.vx; f.y += f.vy;
    if (f.x < 0) { f.x = 0; f.vx = Math.abs(f.vx); f.squash = 1; }
    if (f.x > W - f.size) { f.x = W - f.size; f.vx = -Math.abs(f.vx); f.squash = 1; }
    if (f.y < 0) { f.y = 0; f.vy = Math.abs(f.vy); f.squash = 1; }
    if (f.y > H - f.size) { f.y = H - f.size; f.vy = -Math.abs(f.vy); f.squash = 1; }
    f.vr *= 0.95; f.rot += f.vr + f.vx * 0.6; f.squash *= 0.8;
    const s = 1 - f.squash * 0.25;
    f.el.style.transform = `translate(${f.x}px, ${f.y}px) rotate(${f.rot}deg) scale(${1 / s}, ${s})`;
  }
  requestAnimationFrame(tick);
}
spawnFace(innerWidth * 0.3, innerHeight * 0.3);
requestAnimationFrame(tick);

$("shareBtn").onclick = async () => {
  const text = shareText();
  try {
    if (navigator.share && matchMedia("(pointer: coarse)").matches) await navigator.share({ text });
    else { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); }
  } catch { toast("Couldn't share"); }
};

// keyboard
const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
rows.forEach((r, i) => {
  const d = document.createElement("div"); d.className = "kr";
  const add = (label, k, wide) => {
    const b = document.createElement("button"); b.className = "key" + (wide ? " wide" : "");
    b.textContent = label; b.onclick = e => { e.currentTarget.blur(); press(k); }; d.appendChild(b);
  };
  if (i === 2) add("Enter", "enter", true);
  for (const c of r) add(c, c);
  if (i === 2) add("⌫", "back", true);
  $("kb").appendChild(d);
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.querySelector(".modal.open")) { if (e.key === "Escape") closeModals(); return; }
  // stop Enter from also clicking whichever button was tapped last
  if (e.key === "Enter") { e.preventDefault(); press("enter"); }
  else if (e.key === "Backspace") press("back");
  else press(e.key.toLowerCase());
});

function closeModals() { document.querySelectorAll(".modal").forEach(m => m.classList.remove("open")); }
document.querySelectorAll(".modal").forEach(m => m.onclick = e => { if (e.target === m || e.target.hasAttribute("data-close")) closeModals(); });
$("helpBtn").onclick = () => $("help").classList.add("open");
$("undoBtn").onclick = undo;
$("hintBtn").onclick = hint;
$("newBtn").onclick = () => { closeModals(); load(true, POOL[Math.floor(Math.random() * POOL.length)]); toast("Practice round"); };

load(false, DAILY);
if (!store.get("jamesel-seen")) { store.set("jamesel-seen", 1); $("help").classList.add("open"); }
</script>
</body>
</html>
